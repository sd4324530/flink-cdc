name: Flink CDC CI Nightly
on:
  schedule:
    - cron: '43 0 * * *' # Run daily, but not at 00:00 UTC to avoid job failure due to network throttle
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  license_check:
    if: github.repository == 'apache/flink-cdc'
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Set JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compiling jar packages
        run: mvn --no-snapshot-updates -B package -DskipTests
      - name: Run license check
        run: gem install rubyzip -v 2.3.0 && ./tools/ci/license_check.rb
  common:
    if: github.repository == 'apache/flink-cdc'
    name: Common Unit Tests
    uses: ./.github/workflows/flink_cdc_base.yml
    with:
      java-versions: "[17]"
      modules: "['core']"
  version-modules:
    # Verifies the 2.2 version module: own tests plus the rerun suites (per-Flink-version
    # modules FLIP) on Java 17.
    if: github.repository == 'apache/flink-cdc'
    name: Version Modules (2.2)
    uses: ./.github/workflows/flink_cdc_base.yml
    with:
      java-versions: "[17]"
      modules: "['version_modules']"
  pipeline-ut:
    if: github.repository == 'apache/flink-cdc'
    name: Pipeline Unit Tests
    uses: ./.github/workflows/flink_cdc_base.yml
    with:
      java-versions: "[17]"
      modules: "['doris, elasticsearch, fluss, hudi, iceberg, kafka, maxcompute, mysql-pipeline, oceanbase-pipeline, paimon, postgres-pipeline, starrocks, oracle-pipeline']"
  source-ut:
    if: github.repository == 'apache/flink-cdc'
    name: Source Unit Tests
    uses: ./.github/workflows/flink_cdc_base.yml
    with:
      java-versions: "[17]"
      modules: "['mysql-source', 'postgres-source, oceanbase-source, tidb, vitess', 'oracle, sqlserver', 'db2, mongodb']"
  pipeline_e2e:
    if: github.repository == 'apache/flink-cdc'
    name: Pipeline E2E Tests
    uses: ./.github/workflows/flink_cdc_base.yml
    with:
      java-versions: "[17]"
      flink-versions: "['1.20.3']"
      modules: "['pipeline_e2e']"
      e2e-stages: "['stage1', 'stage2', 'stage3']"
  pipeline_e2e_2_x:
    # 2.2-line pipeline e2e. This cannot reuse the base template: the base template
    # applies custom-maven-parameter to the full-reactor install, and the 2.2 profile
    # cannot compile main modules (it swaps guava31 for guava33 whose shaded package
    # names differ). Correct semantics (verified locally): default-line full install
    # -> release-flink2.2 package of dist + sql-connector + values -> verify WITHOUT
    # the profile (specifiedFlinkVersion selects the Flink 2.2 images; the values
    # connector jar carries the SinkFunction exclusion, and TarballFetcher deploys
    # the flink-cdc-flink-2.2 shadow-class jar next to the fat jars).
    if: github.repository == 'apache/flink-cdc'
    name: Pipeline E2E Tests 2.x (${{ matrix.stage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        stage: ['stage1', 'stage2', 'stage3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clean up disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      - name: Relocate Docker data-root to /mnt
        run: |
          set -euo pipefail
          # Same rationale as the base template: e2e containers (notably OceanBase's OBD
          # pre-check for ~10G free) need the secondary volume's headroom.
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep "Docker Root Dir"
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set Maven 3.8.6
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.6
      - name: Install all modules (default line)
        run: mvn --no-snapshot-updates -B clean install -DskipTests -T 1C
      - name: Install 2.2-line artifacts
        # install (not package) and across ALL pipeline connectors: the e2e module copies
        # connector jars from the local repo via maven-dependency-plugin, so the 2.2-line
        # jars must land in the repo for the verify step to pick them up (proven semantics
        # from the local 2.2-line e2e run; packaging only 3 modules leaves the repo with
        # default-line jars and silently tests the wrong line).
        run: |
          mvn --no-snapshot-updates -B install -DskipTests -Prelease-flink2.2 \
            -pl flink-cdc-dist,flink-cdc-connect/flink-cdc-source-connectors/flink-sql-connector-mysql-cdc,flink-cdc-connect/flink-cdc-pipeline-connectors
      - name: Run e2e (${{ matrix.stage }})
        run: |
          stage=${{ matrix.stage }}
          extra="-De2eIncludePattern=**/${stage}/**/*ITCase.java"
          if [ "$stage" != "stage1" ]; then extra="$extra -DskipYarnTest=true"; fi
          # -Dflink.profile gates the 2.2-line known-gap classes (Kafka/ES6/ES7/Recovery,
          # @DisabledIfSystemProperty, tracked in FLINK-xxxxx) so the job stays green.
          mvn --no-snapshot-updates -B -DspecifiedMongoVersion=8.0.14 \
            -DspecifiedFlinkVersion=2.2.0 -Dflink.profile=flink2.2 $extra \
            -pl flink-cdc-e2e-tests/flink-cdc-pipeline-e2e-tests -Duser.timezone=GMT+8 verify
  source_e2e:
    if: github.repository == 'apache/flink-cdc'
    name: Source E2E Tests
    uses: ./.github/workflows/flink_cdc_base.yml
    with:
      java-versions: "[17]"
      flink-versions: "['1.20.3']"
      modules: "['source_e2e']"
  release-line-assertions:
    # Per-Flink-version modules FLIP: nightly integrity assertions on both release lines —
    # no duplicate classes in the shaded artifacts, version-module marker classes on the
    # right line, line-correct ecosystem dependency resolution (tools/ci/verify-release-line.sh).
    # Class-set parity against legacy -Pflink2 baselines is not asserted here (the baselines
    # are local-only); it was proven during the migration and is re-checked on demand.
    if: github.repository == 'apache/flink-cdc'
    name: Release Line Assertions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set JDK
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set Maven 3.8.6
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.6
      - name: Install all modules (baseline line)
        run: mvn --no-snapshot-updates -B clean install -DskipTests
      - name: Build and assert 1.20 line
        run: |
          mvn --no-snapshot-updates -B package -Prelease-flink1.20 -DskipTests \
            -pl flink-cdc-dist,flink-cdc-connect/flink-cdc-source-connectors/flink-sql-connector-mysql-cdc
          tools/ci/verify-release-line.sh flink1.20 \
            --dist-tar flink-cdc-dist/target/flink-cdc-*-flink1.20-bin.tar.gz
      - name: Build and assert 2.2 line
        run: |
          mvn --no-snapshot-updates -B package -Prelease-flink2.2 -DskipTests \
            -pl flink-cdc-dist,flink-cdc-connect/flink-cdc-source-connectors/flink-sql-connector-mysql-cdc
          tools/ci/verify-release-line.sh flink2.2 \
            --dist-tar flink-cdc-dist/target/flink-cdc-*-flink2.2-bin.tar.gz
      - name: Assert adapter contract (version-module public signatures)
        run: tools/ci/verify-adapter-contract.sh
